<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" /> <!-- CRITICAL FIX FOR IMAGE LOADING -->
  <title>स्मार्ट AI गैलरी • BJP Dashboard</title>

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <!-- AI Library for Face Recognition -->
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

  <!-- SweetAlert for nice popups -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    :root {
      --primary: #ff9933; /* BJP Saffron */
      --secondary: #138808; /* Green */
      --bg: #fffdf9;
      --card-bg: #ffffff;
      --text: #333;
    }

    body {
      font-family: 'Noto Sans Devanagari', sans-serif;
      background: var(--bg);
      margin: 0;
      color: var(--text);
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #ff9933 0%, #ff6600 100%);
      color: white;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 12px rgba(255, 102, 0, 0.2);
    }

    .header h1 { margin: 0; font-size: 1.5rem; display: flex; align-items: center; gap: 10px; }
    .status-badge { background: rgba(0,0,0,0.2); padding: 5px 12px; border-radius: 20px; font-size: 0.9rem; }

    /* Layout */
    .main-container {
      display: grid;
      grid-template-columns: 320px 1fr;
      height: calc(100vh - 70px);
      gap: 20px;
      padding: 20px;
    }

    /* Sidebar - Known Faces */
    .sidebar {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      overflow-y: auto;
      border: 1px solid #eee;
      display: flex;
      flex-direction: column;
    }

    .sidebar h3 { margin-top: 0; color: #d35400; border-bottom: 2px solid #ffe0b2; padding-bottom: 10px; }
    
    .search-box {
      margin-bottom: 15px;
    }
    .search-box input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-family: inherit;
    }

    .person-list {
      flex: 1;
      overflow-y: auto;
    }

    .person-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      background: #fff;
      border: 1px solid #eee;
      border-radius: 8px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .person-card:hover, .person-card.active {
      border-color: var(--primary);
      background: #fff8e1;
      transform: translateX(5px);
    }
    .person-face {
      width: 50px; height: 50px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #ddd;
    }
    .person-info h4 { margin: 0; font-size: 1rem; }
    .person-info p { margin: 2px 0 0; font-size: 0.8rem; color: #666; }
    .match-count { 
      background: var(--secondary); color: white; 
      font-size: 0.75rem; padding: 2px 6px; border-radius: 10px; 
      margin-left: auto;
    }

    /* Main Area - Gallery */
    .gallery-area {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      overflow-y: auto;
      border: 1px solid #eee;
    }

    .gallery-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .controls { display: flex; gap: 10px; }
    
    .controls button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .controls button.secondary { background: #607d8b; }
    .controls button:hover { opacity: 0.9; }
    .controls button:disabled { background: #ccc; cursor: not-allowed; }

    /* Photo Grid */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
    }

    .photo-card {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #eee;
      aspect-ratio: 1;
      cursor: zoom-in;
    }
    .photo-card img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }
    .photo-card:hover img { transform: scale(1.05); }
    
    /* Loading State */
    .loader {
      display: none;
      text-align: center;
      padding: 40px;
    }
    .loader i { font-size: 3rem; color: var(--primary); animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* Timeline View */
    .timeline-container {
      max-width: 800px;
      margin: 0 auto;
    }
    .timeline-item {
      padding: 15px;
      border-left: 3px solid var(--primary);
      margin-left: 10px;
      margin-bottom: 20px;
      background: #fff;
      position: relative;
      border-radius: 0 8px 8px 0;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .timeline-item::before {
      content: '';
      position: absolute; left: -9px; top: 20px;
      width: 15px; height: 15px;
      background: var(--primary);
      border-radius: 50%;
      border: 3px solid #fff;
    }
    .timeline-date {
      font-size: 0.85rem;
      color: #777;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 5px;
    }

    @media (max-width: 768px) {
      .main-container { grid-template-columns: 1fr; height: auto; }
      .sidebar { height: 400px; }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1><i class="fas fa-camera-retro"></i> स्मार्ट AI गैलरी (Smart Gallery)</h1>
    <div class="status-badge" id="modelStatus">AI Models Loading...</div>
  </div>

  <div class="main-container">
    <!-- Sidebar: Known People (Visitors) -->
    <div class="sidebar">
      <h3><i class="fas fa-users"></i> कार्यकर्ता / आगंतुक</h3>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="नाम या मोबाइल से खोजें..." onkeyup="filterVisitors()">
      </div>
      <div id="visitorList" class="person-list">
        <div style="text-align:center; padding: 20px; color:#999;">
          <i class="fas fa-spinner fa-spin"></i> लोड हो रहा है...
        </div>
      </div>
    </div>

    <!-- Main: Matches & Photos -->
    <div class="gallery-area">
      <div class="gallery-header">
        <h2 id="galleryTitle">फोटो डैशबोर्ड</h2>
        <div class="controls">
          <button id="scanBtn" onclick="startScanning()" disabled>
            <i class="fas fa-magic"></i> Scan All (AI)
          </button>
          <button id="downloadBtn" class="secondary" onclick="downloadReport()" style="display:none">
            <i class="fas fa-download"></i> रिपोर्ट डाउनलोड
          </button>
        </div>
      </div>

      <div class="loader" id="loader">
        <i class="fas fa-circle-notch"></i>
        <h3 id="loaderText">AI चेहरों को स्कैन कर रहा है...</h3>
        <p>सिस्टम सभी इवेंट फोटोज में चेहरों को ढूंढ रहा है। कृपया प्रतीक्षा करें।</p>
      </div>

      <div id="galleryContent" class="photo-grid">
        <!-- Photos will appear here -->
        <div style="grid-column: 1/-1; text-align: center; padding: 60px; color: #888;">
          <i class="fas fa-images fa-4x" style="margin-bottom:20px; display:block; opacity:0.2"></i>
          <p>बाईं ओर किसी कार्यकर्ता पर क्लिक करें या <strong>"Scan All"</strong> बटन दबाकर जादू देखें!</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase Scripts -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getFirestore, collection, getDocs, query, orderBy, limit } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

    // --- Configuration ---
    const firebaseConfig = {
      apiKey: "AIzaSyCI1EL8iFVJnOWbd58Bq5JrJg_IgZuCvA0",
      authDomain: "mandaleventall.firebaseapp.com",
      projectId: "mandaleventall",
      storageBucket: "mandaleventall.firebasestorage.app",
      messagingSenderId: "900190130114",
      appId: "1:900190130114:web:bc7d9e2283b3ac57bc505b"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // --- Global State ---
    let visitors = []; 
    let reportPhotos = []; 
    let faceMatcher = null;
    let isModelsLoaded = false;
    let selectedVisitorIndex = -1;

    // --- DOM Elements ---
    const visitorListEl = document.getElementById('visitorList');
    const galleryContentEl = document.getElementById('galleryContent');
    const scanBtn = document.getElementById('scanBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const modelStatusEl = document.getElementById('modelStatus');

    // --- 1. Load AI Models ---
    async function loadModels() {
      try {
        const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';
        await Promise.all([
          faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
          faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
          faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
        ]);
        isModelsLoaded = true;
        modelStatusEl.innerText = "✅ AI Ready";
        modelStatusEl.style.background = "#2e7d32";
        scanBtn.disabled = false;
        loadVisitors();
      } catch (err) {
        console.error("Model Load Error:", err);
        modelStatusEl.innerText = "❌ AI Error";
        modelStatusEl.style.background = "#c62828";
        alert("AI Models लोड नहीं हो पाए। इंटरनेट कनेक्शन चेक करें।");
      }
    }

    // --- 2. Load Visitors (Known Faces) ---
    async function loadVisitors() {
      visitorListEl.innerHTML = '<div style="text-align:center; padding:10px;">विजिटर डेटा लोड हो रहा है...</div>';
      try {
        const q = query(collection(db, "visitors"), orderBy("timestamp", "desc"), limit(100)); 
        const snapshot = await getDocs(q);
        visitors = [];
        snapshot.forEach(doc => {
          const data = doc.data();
          if (data.selfie) {
            visitors.push({
              id: doc.id,
              name: data.name || "Unknown",
              mobile: data.mobile || "No Mobile",
              selfie: data.selfie,
              mandal: data.mandal,
              timestamp: data.timestamp,
              matches: [] 
            });
          }
        });
        renderSidebar();
      } catch (err) {
        console.error("Visitor Load Error:", err);
        visitorListEl.innerHTML = '<div style="color:red">डेटा लोड फेल</div>';
      }
    }

    // --- 3. Render Sidebar ---
    window.filterVisitors = function() {
      renderSidebar();
    }

    function renderSidebar() {
      const filter = document.getElementById('searchInput').value.toLowerCase();
      visitorListEl.innerHTML = '';
      
      const filtered = visitors.filter(v => 
        (v.name && v.name.toLowerCase().includes(filter)) || 
        (v.mobile && v.mobile.includes(filter))
      );

      if(filtered.length === 0) {
        visitorListEl.innerHTML = '<div style="padding:10px; text-align:center">कोई डेटा नहीं</div>';
        return;
      }

      filtered.forEach((v) => {
        // Find original index
        const index = visitors.indexOf(v);
        const div = document.createElement('div');
        div.className = `person-card ${index === selectedVisitorIndex ? 'active' : ''}`;
        div.onclick = () => showPersonDetails(index);
        div.innerHTML = `
          <img src="${v.selfie}" class="person-face" alt="${v.name}" crossorigin="anonymous">
          <div class="person-info">
            <h4>${v.name}</h4>
            <p>${v.mandal || ''}</p>
            <p style="font-size:0.75rem">${v.mobile}</p>
          </div>
          <div class="match-count" id="count-${v.id}">${v.matches.length || 0}</div>
        `;
        visitorListEl.appendChild(div);
      });
    }

    // --- 4. Start AI Scanning ---
    window.startScanning = async function() {
      scanBtn.disabled = true;
      scanBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
      document.getElementById('loader').style.display = 'block';
      galleryContentEl.innerHTML = '';
      downloadBtn.style.display = 'none';

      try {
        // A. Process Visitors
        document.getElementById('loaderText').innerText = "1/3: विजिटर चेहरों को याद किया जा रहा है...";
        const labeledDescriptors = [];
        
        for (let v of visitors) {
          try {
            if(!v.descriptor) { // Only process if not already processed
                const img = await faceapi.fetchImage(v.selfie);
                const detection = await faceapi.detectSingleFace(img).withFaceLandmarks().withFaceDescriptor();
                if (detection) {
                    v.descriptor = detection.descriptor;
                    labeledDescriptors.push(new faceapi.LabeledFaceDescriptors(v.id, [detection.descriptor]));
                }
            } else {
                labeledDescriptors.push(new faceapi.LabeledFaceDescriptors(v.id, [v.descriptor]));
            }
          } catch(e) { console.warn(`Error processing selfie: ${v.name}`, e); }
        }

        if (labeledDescriptors.length === 0) throw new Error("कोई भी साफ़ चेहरा नहीं मिला।");
        faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.55); // Stricter threshold

        // B. Fetch Event Photos
        document.getElementById('loaderText').innerText = "2/3: इवेंट फोटो लोड की जा रही हैं...";
        if(reportPhotos.length === 0) reportPhotos = await fetchAllReportPhotos();

        // C. Match Faces
        document.getElementById('loaderText').innerText = `3/3: ${reportPhotos.length} फोटोज स्कैन हो रही हैं...`;
        
        let matchCount = 0;
        // Reset matches
        visitors.forEach(v => v.matches = []);

        for (let i = 0; i < reportPhotos.length; i++) {
          const photo = reportPhotos[i];
          document.getElementById('loaderText').innerText = `3/3: स्कैनिंग फोटो ${i+1}/${reportPhotos.length}...`;
          
          try {
            const img = await faceapi.fetchImage(photo.url);
            const detections = await faceapi.detectAllFaces(img).withFaceLandmarks().withFaceDescriptors();
            
            detections.forEach(fd => {
              const bestMatch = faceMatcher.findBestMatch(fd.descriptor);
              if (bestMatch.label !== 'unknown') {
                const visitorId = bestMatch.label;
                const visitor = visitors.find(v => v.id === visitorId);
                if (visitor) {
                  // Avoid duplicates
                  if(!visitor.matches.some(m => m.url === photo.url)) {
                      visitor.matches.push(photo);
                      matchCount++;
                  }
                }
              }
            });
          } catch (e) { console.warn("Skipped photo", e); }
        }

        renderSidebar(); // Update counts
        Swal.fire("स्कैन पूरा हुआ!", `कुल ${matchCount} चेहरे पहचाने गए।`, "success");

        // If a person was selected, refresh their view
        if(selectedVisitorIndex !== -1) showPersonDetails(selectedVisitorIndex);
        else galleryContentEl.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:40px;"><h3>स्कैन पूरा हुआ!</h3><p>अब किसी भी कार्यकर्ता पर क्लिक करके देखें कि वो कहाँ-कहाँ गया था।</p></div>`;

      } catch (err) {
        console.error(err);
        Swal.fire("Error", "स्कैनिंग में समस्या: " + err.message, "error");
      } finally {
        document.getElementById('loader').style.display = 'none';
        scanBtn.disabled = false;
        scanBtn.innerHTML = '<i class="fas fa-magic"></i> Scan All (AI)';
      }
    }

    async function fetchAllReportPhotos() {
      const photos = [];
      const eventNamesSnap = await getDocs(collection(db, "eventNames"));
      for (const evDoc of eventNamesSnap.docs) {
        const eventName = evDoc.data().name;
        const reportsSnap = await getDocs(collection(db, `eventNames/${evDoc.id}/reports`));
        reportsSnap.forEach(rDoc => {
          const rData = rDoc.data();
          if (rData.photos && Array.isArray(rData.photos)) {
            rData.photos.forEach(url => {
              photos.push({
                url: url,
                eventName: eventName,
                mandal: rData.mandal,
                date: rData.date,
                location: rData.location
              });
            });
          }
        });
      }
      return photos;
    }

    // --- 5. Show Person Details & Report ---
    window.showPersonDetails = function(index) {
      selectedVisitorIndex = index;
      renderSidebar(); // highlight active

      const v = visitors[index];
      downloadBtn.style.display = 'inline-flex';
      
      galleryContentEl.className = ''; // remove grid class for timeline layout
      galleryContentEl.innerHTML = '';

      // 1. Profile Header
      const profileDiv = document.createElement('div');
      profileDiv.innerHTML = `
        <div style="display:flex; gap:20px; align-items:center; background:#f0f4f8; padding:20px; border-radius:12px; border:1px solid #dbeafe;">
           <img src="${v.selfie}" style="width:110px; height:110px; border-radius:50%; object-fit:cover; border:4px solid white; box-shadow:0 4px 6px rgba(0,0,0,0.1);" crossorigin="anonymous">
           <div>
             <h2 style="margin:0; color:#1e293b;">${v.name}</h2>
             <p style="margin:5px 0; color:#64748b;">${v.mandal} • ${v.mobile}</p>
             <div style="margin-top:8px;">
                <span class="status-badge" style="background:#dcfce7; color:#166534; border:1px solid #bbf7d0;">Office Visitor</span>
                ${v.matches.length > 0 ? `<span class="status-badge" style="background:#fff7ed; color:#c2410c; border:1px solid #fed7aa; margin-left:8px;">Found in ${v.matches.length} Events</span>` : ''}
             </div>
           </div>
        </div>
        <div class="timeline-container" style="margin-top:30px;">
            <h3 style="color:#475569; border-bottom:2px solid #e2e8f0; padding-bottom:10px; margin-bottom:20px;">
              <i class="fas fa-history"></i> गतिविधि टाइमलाइन (Activity Timeline)
            </h3>
        </div>
      `;
      galleryContentEl.appendChild(profileDiv);

      const timelineContainer = profileDiv.querySelector('.timeline-container');

      // 2. Timeline Logic
      // Combine Office Visit + Event Matches
      let timelineEvents = [];
      
      // A. Office Visit (Registration)
      if(v.timestamp) {
        // Try to convert timestamp
        let dateStr = "Unknown Date";
        try { dateStr = v.timestamp.toDate ? v.timestamp.toDate().toLocaleDateString('hi-IN') : new Date(v.timestamp).toLocaleDateString('hi-IN'); } catch(e){}
        
        timelineEvents.push({
            type: 'office',
            date: dateStr,
            rawDate: v.timestamp.toDate ? v.timestamp.toDate() : new Date(v.timestamp),
            title: 'BJP कार्यालय विजिट',
            desc: 'आगंतुक पंजीयन किया गया',
            img: v.selfie
        });
      }

      // B. Matches
      v.matches.forEach(m => {
        timelineEvents.push({
            type: 'event',
            date: m.date || 'Unknown',
            rawDate: new Date(m.date),
            title: m.eventName,
            desc: `स्थान: ${m.location} | मंडल: ${m.mandal}`,
            img: m.url
        });
      });

      // Sort by date (Newest first)
      timelineEvents.sort((a,b) => b.rawDate - a.rawDate);

      if (timelineEvents.length === 0) {
        timelineContainer.innerHTML += `<div style="text-align:center; padding:20px; color:#999;">कोई डेटा उपलब्ध नहीं</div>`;
        return;
      }

      timelineEvents.forEach(evt => {
        const item = document.createElement('div');
        item.className = 'timeline-item';
        item.innerHTML = `
          <div class="timeline-date"><i class="far fa-calendar-alt"></i> ${evt.date}</div>
          <strong style="font-size:1.1rem; color:#334155;">${evt.title}</strong>
          <div style="margin-top:4px; font-size:0.95rem; color:#64748b;">${evt.desc}</div>
          ${evt.type === 'event' ? 
            `<div style="margin-top:12px; height:220px; border-radius:8px; overflow:hidden; border:1px solid #e2e8f0;">
               <img src="${evt.img}" style="width:100%; height:100%; object-fit:contain; background:#0f172a;" crossorigin="anonymous">
            </div>` : ''
          }
        `;
        timelineContainer.appendChild(item);
      });
    }

    // --- 6. Download Report Logic ---
    window.downloadReport = function() {
        if(selectedVisitorIndex === -1) return;
        const v = visitors[selectedVisitorIndex];
        
        let reportText = `BJP कार्यकर्ता रिपोर्ट\n------------------\n`;
        reportText += `नाम: ${v.name}\nमोबाइल: ${v.mobile}\nमंडल: ${v.mandal}\n\n`;
        reportText += `गतिविधि इतिहास:\n`;
        
        if(v.matches.length === 0) reportText += "(सिर्फ कार्यालय विजिट, कोई अन्य इवेंट फोटो नहीं मिला)\n";
        
        v.matches.forEach((m, i) => {
            reportText += `${i+1}. ${m.eventName} (${m.date}) - स्थान: ${m.location}\n`;
        });

        // Simple text download
        const blob = new Blob([reportText], { type: "text/plain;charset=utf-8" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `${v.name}_Report.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    // Init
    loadModels();
  </script>
</body>
</html>
